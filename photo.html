<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#c90000">
  <title>Your McDonald's Photo</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#8d0000,#e00000);font-family:Arial,sans-serif;color:white}.card{width:min(94vw,620px);padding:22px;border:3px solid #ffcd00;border-radius:26px;background:#a90000;box-shadow:0 20px 60px #42000088;text-align:center}h1{margin:4px 0 18px;color:#ffcd00}img{display:block;width:100%;max-height:72vh;object-fit:contain;border-radius:16px;background:#260000}.message{padding:40px 10px;font-size:18px}.download{display:none;margin-top:20px;padding:15px 26px;border-radius:999px;background:#ffcd00;color:#b00000;text-decoration:none;font-weight:800}.download.ready{display:inline-block}
  </style>
</head>
<body>
  <main class="card">
    <h1>Your McDonald's Moment</h1>
    <div id="message" class="message">Loading your photo…</div>
    <img id="photo" alt="Your generated McDonald's avatar" hidden>
    <a id="download" class="download" download="mcdonalds-moment.jpg">Download photo</a>
  </main>
  <script src="photo.js"></script>
</body>
</html>
